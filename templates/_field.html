<div class="field{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}{% if field.field.widget.allow_multiple_selected and field.field.widget.input_type == 'checkbox' %} checks{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' and not field.field.widget.allow_multiple_selected %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted small">(optional)</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<ul class="errors">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
